<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#1e293b" />
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="bold">AWS Solutions Architect - Associate | Serverless Image Processing Pipeline</text>
  <text x="1020" y="42" fill="#38bdf8" font-size="14" font-weight="600">Production Architecture</text>

  <!-- Main Architecture Container -->
  <rect x="30" y="90" width="1140" height="640" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- SECTION 1: INGESTION & UPLOAD -->
  <rect x="50" y="110" width="220" height="590" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="65" y="135" fill="#60a5fa" font-size="13" font-weight="bold">1. INGESTION &amp; CLIENT</text>

  <!-- Client Box -->
  <g transform="translate(70, 160)" filter="url(#shadow)">
    <rect width="180" height="80" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="35" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Client Browser</text>
    <text x="90" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Web App / CLI</text>
  </g>

  <!-- API Gateway Box -->
  <g transform="translate(70, 280)" filter="url(#shadow)">
    <rect width="180" height="80" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="35" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon API Gateway</text>
    <text x="90" y="55" fill="#e0f2fe" font-size="11" text-anchor="middle">POST /upload-url</text>
  </g>

  <!-- Presign Lambda -->
  <g transform="translate(70, 400)" filter="url(#shadow)">
    <rect width="180" height="80" rx="8" fill="#ea580c" stroke="#fb923c" stroke-width="1.5"/>
    <text x="90" y="35" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Presign Lambda</text>
    <text x="90" y="55" fill="#ffedd5" font-size="11" text-anchor="middle">Generate S3 PUT URL</text>
  </g>

  <!-- Source S3 -->
  <g transform="translate(70, 560)" filter="url(#shadow)">
    <rect width="180" height="90" rx="8" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="90" y="35" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon S3 Source</text>
    <text x="90" y="55" fill="#dcfce7" font-size="10" text-anchor="middle">raw uploads/</text>
    <text x="90" y="70" fill="#86efac" font-size="9" text-anchor="middle">Lifecycle: IA(30d) Exp(90d)</text>
  </g>

  <!-- SECTION 2: EVENT DECOUPLING & BUFFERING -->
  <rect x="290" y="110" width="220" height="590" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="305" y="135" fill="#fb923c" font-size="13" font-weight="bold">2. DECOUPLING (SQS &amp; DLQ)</text>

  <!-- SQS Queue -->
  <g transform="translate(310, 280)" filter="url(#shadow)">
    <rect width="180" height="80" rx="8" fill="#c2410c" stroke="#fdba74" stroke-width="1.5"/>
    <text x="90" y="35" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon SQS Queue</text>
    <text x="90" y="55" fill="#ffedd5" font-size="11" text-anchor="middle">Event Decoupling</text>
  </g>

  <!-- SQS DLQ -->
  <g transform="translate(310, 420)" filter="url(#shadow)">
    <rect width="180" height="80" rx="8" fill="#991b1b" stroke="#f87171" stroke-width="1.5"/>
    <text x="90" y="35" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SQS Dead-Letter (DLQ)</text>
    <text x="90" y="55" fill="#fee2e2" font-size="11" text-anchor="middle">MaxReceiveCount: 3</text>
  </g>

  <!-- SQS Consumer Lambda -->
  <g transform="translate(310, 560)" filter="url(#shadow)">
    <rect width="180" height="90" rx="8" fill="#ea580c" stroke="#fb923c" stroke-width="1.5"/>
    <text x="90" y="35" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SQS Consumer Lambda</text>
    <text x="90" y="55" fill="#ffedd5" font-size="11" text-anchor="middle">Batch Size: 5</text>
    <text x="90" y="70" fill="#fed7aa" font-size="10" text-anchor="middle">Triggers Step Functions</text>
  </g>

  <!-- SECTION 3: STEP FUNCTIONS WORKFLOW -->
  <rect x="530" y="110" width="360" height="590" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="545" y="135" fill="#c084fc" font-size="13" font-weight="bold">3. AWS STEP FUNCTIONS ORCHESTRATION</text>

  <!-- Step 1: Validator -->
  <g transform="translate(560, 160)" filter="url(#shadow)">
    <rect width="300" height="65" rx="6" fill="#6b21a8" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="150" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Validate Image Lambda</text>
    <text x="150" y="48" fill="#e9d5ff" font-size="10" text-anchor="middle">Verify format (.jpg/.png) &amp; size &lt; 15MB</text>
  </g>

  <!-- Step 2: Resizer -->
  <g transform="translate(560, 255)" filter="url(#shadow)">
    <rect width="300" height="65" rx="6" fill="#6b21a8" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="150" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. Image Resizer Lambda (Pillow)</text>
    <text x="150" y="48" fill="#e9d5ff" font-size="10" text-anchor="middle">Create Thumb (200px), Med (800px), Large (1600px)</text>
  </g>

  <!-- Step 3: Watermark -->
  <g transform="translate(560, 350)" filter="url(#shadow)">
    <rect width="300" height="65" rx="6" fill="#6b21a8" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="150" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3. Watermark Processor Lambda</text>
    <text x="150" y="48" fill="#e9d5ff" font-size="10" text-anchor="middle">Apply Alpha Branding Watermark</text>
  </g>

  <!-- Step 4: Metadata Extractor -->
  <g transform="translate(560, 445)" filter="url(#shadow)">
    <rect width="300" height="65" rx="6" fill="#6b21a8" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="150" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4. Metadata Extractor Lambda</text>
    <text x="150" y="48" fill="#e9d5ff" font-size="10" text-anchor="middle">Write EXIF &amp; S3 Keys to DynamoDB</text>
  </g>

  <!-- Step 5: Notifier -->
  <g transform="translate(560, 540)" filter="url(#shadow)">
    <rect width="300" height="65" rx="6" fill="#6b21a8" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="150" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5. Notification Handler Lambda</text>
    <text x="150" y="48" fill="#e9d5ff" font-size="10" text-anchor="middle">Publish Success/Failure Alerts to SNS</text>
  </g>

  <!-- Catch / Failure arrow indicator -->
  <rect x="560" y="625" width="300" height="45" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
  <text x="710" y="652" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">Catch [States.ALL] ➔ Publish Failure via SNS</text>

  <!-- SECTION 4: STORAGE, DISTRIBUTION & NOTIFICATIONS -->
  <rect x="910" y="110" width="240" height="590" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="925" y="135" fill="#34d399" font-size="13" font-weight="bold">4. OUTPUT &amp; DELIVERY</text>

  <!-- S3 Destination -->
  <g transform="translate(935, 160)" filter="url(#shadow)">
    <rect width="190" height="80" rx="8" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="95" y="32" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon S3 Destination</text>
    <text x="95" y="52" fill="#dcfce7" font-size="10" text-anchor="middle">processed/{imageId}/*</text>
    <text x="95" y="67" fill="#86efac" font-size="9" text-anchor="middle">Tiering: Intelligent Tiering</text>
  </g>

  <!-- CloudFront CDN with OAC -->
  <g transform="translate(935, 275)" filter="url(#shadow)">
    <rect width="190" height="85" rx="8" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="95" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon CloudFront</text>
    <text x="95" y="50" fill="#a7f3d0" font-size="10" text-anchor="middle">Global CDN Delivery</text>
    <text x="95" y="68" fill="#6ee7b7" font-size="9" text-anchor="middle">Origin Access Control (OAC)</text>
  </g>

  <!-- DynamoDB Metadata -->
  <g transform="translate(935, 395)" filter="url(#shadow)">
    <rect width="190" height="80" rx="8" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="95" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon DynamoDB</text>
    <text x="95" y="48" fill="#dbeafe" font-size="10" text-anchor="middle">ImageMetadata Table</text>
    <text x="95" y="65" fill="#93c5fd" font-size="9" text-anchor="middle">PK: ImageId | GSI: Status</text>
  </g>

  <!-- Amazon SNS -->
  <g transform="translate(935, 510)" filter="url(#shadow)">
    <rect width="190" height="75" rx="8" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="95" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Amazon SNS Topic</text>
    <text x="95" y="50" fill="#fef3c7" font-size="10" text-anchor="middle">Email Notifications</text>
  </g>

  <!-- End User / Subscribers -->
  <g transform="translate(935, 615)" filter="url(#shadow)">
    <rect width="190" height="60" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <text x="95" y="27" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Subscribers / Global Viewers</text>
    <text x="95" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">Low Latency Edge Access</text>
  </g>

  <!-- CONNECTING ARROWS & FLOW -->
  <!-- Client -> API GW -->
  <line x1="160" y1="240" x2="160" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- API GW -> Presign Lambda -->
  <line x1="160" y1="360" x2="160" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Presign Lambda -> S3 Source -->
  <line x1="160" y1="480" x2="160" y2="560" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- S3 Source -> SQS -->
  <path d="M 250 605 L 400 605 L 400 360" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)" />
  <!-- SQS -> SQS Consumer Lambda -->
  <line x1="400" y1="360" x2="400" y2="560" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- SQS -> DLQ -->
  <line x1="400" y1="360" x2="400" y2="420" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <!-- SQS Consumer Lambda -> Step Functions -->
  <path d="M 490 605 L 520 605 L 520 190 L 560 190" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Step Functions Internal Flow -->
  <line x1="710" y1="225" x2="710" y2="255" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="710" y1="320" x2="710" y2="350" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="710" y1="415" x2="710" y2="445" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="710" y1="510" x2="710" y2="540" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Step Functions Outputs -->
  <!-- Resizer & Watermark -> Destination S3 -->
  <path d="M 860 287 L 900 287 L 900 200 L 935 200" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- Metadata -> DynamoDB -->
  <line x1="860" y1="477" x2="935" y2="435" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Notifier -> SNS -->
  <line x1="860" y1="572" x2="935" y2="547" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Destination S3 -> CloudFront -->
  <line x1="1030" y1="240" x2="1030" y2="275" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- CloudFront -> Global Users -->
  <path d="M 1125 317 L 1145 317 L 1145 645 L 1125 645" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- SNS -> Subscribers -->
  <line x1="1030" y1="585" x2="1030" y2="615" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
</svg>
